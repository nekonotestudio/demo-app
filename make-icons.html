<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>デモ アイコン生成</title></head>
<body style="font-family:sans-serif;padding:20px;background:#1a1424;color:#ece4f4;">
<h2 style="color:#c084fc;">お試しデモ アイコン生成</h2>
<canvas id="c192" width="192" height="192" style="border:1px solid #3a2e54;margin:8px;"></canvas>
<canvas id="c512" width="512" height="512" style="border:1px solid #3a2e54;margin:8px;width:128px;height:128px;"></canvas>
<br>
<button onclick="dl('c192','icon-192.png')" style="margin:6px;padding:8px 16px;background:#c084fc;color:#1a1424;border:none;cursor:pointer;font-weight:700;">icon-192.png をダウンロード</button>
<button onclick="dl('c512','icon-512.png')" style="margin:6px;padding:8px 16px;background:#c084fc;color:#1a1424;border:none;cursor:pointer;font-weight:700;">icon-512.png をダウンロード</button>
<script>
function draw(id){
  const c=document.getElementById(id); const s=c.width; const ctx=c.getContext('2d');
  const g=ctx.createLinearGradient(0,0,s,s); g.addColorStop(0,'#1a1424'); g.addColorStop(1,'#3a2a5e');
  const r=s*0.18; ctx.beginPath();
  ctx.moveTo(r,0);ctx.lineTo(s-r,0);ctx.quadraticCurveTo(s,0,s,r);ctx.lineTo(s,s-r);ctx.quadraticCurveTo(s,s,s-r,s);ctx.lineTo(r,s);ctx.quadraticCurveTo(0,s,0,s-r);ctx.lineTo(0,r);ctx.quadraticCurveTo(0,0,r,0);ctx.closePath();ctx.clip();
  ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
  // 肉球
  ctx.fillStyle='rgba(192,132,252,0.9)';
  const cx=s*0.5, cy=s*0.52, pad=s*0.13;
  ctx.beginPath(); ctx.ellipse(cx,cy+pad*0.5,pad*1.1,pad*0.9,0,0,Math.PI*2); ctx.fill();
  [[-0.9,-1.1],[-0.3,-1.45],[0.3,-1.45],[0.9,-1.1]].forEach(([dx,dy])=>{
    ctx.beginPath(); ctx.ellipse(cx+dx*pad,cy+dy*pad*0.7,pad*0.32,pad*0.42,0,0,Math.PI*2); ctx.fill();
  });
  // TRY
  ctx.fillStyle='#fcd34d'; ctx.font=`bold ${s*0.14}px Arial,sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('お試し', s*0.5, s*0.85);
}
function dl(id,name){ const c=document.getElementById(id); const a=document.createElement('a'); a.download=name; a.href=c.toDataURL('image/png'); a.click(); }
draw('c192'); draw('c512');
</script>
</body>
</html>
